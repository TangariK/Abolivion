<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abolivion</title>
</head>
<body style="margin:0;padding:0;background:#0a120e;font-family:Georgia,'Times New Roman',serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a120e;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:linear-gradient(160deg,#1a2a1e 0%,#141c16 100%);border:1px solid #c4a35a;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 8px;text-align:center;">
              <div style="font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#a8c0a8;font-family:Segoe UI,Tahoma,sans-serif;">
                Early Access
              </div>
              <div style="margin-top:10px;font-size:34px;line-height:1.1;color:#f4d77b;font-weight:normal;">
                Abolivion
              </div>
              <div style="margin:14px auto 0;width:64px;height:2px;background:#c4a35a;"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 8px;text-align:center;">
              <div style="font-size:22px;color:#e8f0e8;line-height:1.35;">
                Bem-vindo à tribo
              </div>
              <p style="margin:16px 0 0;font-size:15px;line-height:1.6;color:#a8c0a8;font-family:Segoe UI,Tahoma,sans-serif;">
                Sua conta no Abolivion está quase pronta. Confirme este e-mail para
                completar o cadastro e proteger seu progresso na nuvem.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 32px 8px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 28px;background:#c4a35a;color:#0d1a12;text-decoration:none;border-radius:8px;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:bold;">
                Confirmar e entrar
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;text-align:center;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#7a927a;font-family:Segoe UI,Tahoma,sans-serif;">
                Se você não criou uma conta, ignore este e-mail.
              </p>
              <p style="margin:18px 0 0;font-size:12px;line-height:1.5;color:#5a705a;font-family:Segoe UI,Tahoma,sans-serif;">
                Abolivion · a noite da floresta espera por você
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
